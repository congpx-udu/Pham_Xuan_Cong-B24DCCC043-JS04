<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .main {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      form {
        background: #ccc;
        padding: 40px;
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }
      button {
        background: #f00;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="main">
      <form id="adminForm">
        <label style="font-size: 20px">Đây là trang Admin</label>
        <button type="submit">Đăng xuất</button>
      </form>
    </div>

    <script>
      if (localStorage.getItem("loggedIn") !== "true") {
        window.location.href = "login.html";
      }

      document
        .getElementById("adminForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          localStorage.removeItem("loggedIn");
          window.location.href = "login.html";
        });
    </script>
  </body>
</html>
