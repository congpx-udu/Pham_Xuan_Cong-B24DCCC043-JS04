<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      a:visited {
        color: green;
      }
      a:link {
        color: red;
      }
      a:hover {
        color: hotpink;
      }
      a:active {
        color: blue;
      }

  </head>

    <h2>CSS Links</h2>
    <p>
      <b><a href="https://vnua.edu.vn" target="_blank">This is a link</a></b>
    </p>
  </body>
</html>
