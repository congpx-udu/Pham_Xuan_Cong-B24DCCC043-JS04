<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="main">
      <div id="container">
        <h1>📝Danh sách công việc hôm nay</h1>
        <div class="form">
          <div class="todo-list">
            <div id="top" class="moring">
              <input type="checkbox" id="checkbox1" hidden />
              <label for="checkbox1" class="todo-content">
                <span class="todo-text">Đi thực hành lập trình Script</span>
                <span class="checkmark">✅</span>
              </label>
            </div>

            <div class="afternoon">
              <input type="checkbox" id="checkbox2" hidden />
              <label for="checkbox2" class="todo-content">
                <span class="todo-text">Làm bài tập tiếng Anh</span>
                <span class="checkmark">✅</span>
              </label>
            </div>

            <div class="evening">
              <input type="checkbox" id="checkbox3" hidden />
              <label for="checkbox3" class="todo-content">
                <span class="todo-text">Đọc tài liệu về Front End</span>
                <span class="checkmark">✅</span>
              </label>
            </div>

            <div class="afternoon">
              <input type="checkbox" id="checkbox4" hidden />
              <label for="checkbox4" class="todo-content">
                <span class="todo-text">Đi đánh cầu lông</span>
                <span class="checkmark">✅</span>
              </label>
            </div>

            <div class="evening">
              <input type="checkbox" id="checkbox5" hidden />
              <label for="checkbox5" class="todo-content">
                <span class="todo-text">Làm bài tập Javascript</span>
                <span class="checkmark">✅</span>
              </label>
            </div>
          </div>
        </div>
        <div class="note">
          <p data-type="reminder">*Ghi nhớ: Kỷ luật là sức mạnh</p>
        </div>
      </div>
    </div>
  </body>
</html>
