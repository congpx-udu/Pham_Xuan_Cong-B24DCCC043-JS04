<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="./assets/css/login.css" />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:400,600,700,800&amp;display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <div class="form sign-in">
        <h2>Đăng Nhập Tài Khoản</h2>
        <label for="">
          <span>Địa chỉ Email</span>
          <input type="email" />
        </label>
        <label for="">
          <span>Mật Khẩu</span>
          <input type="password" />
        </label>
        <button class="submit" type="submit">Đăng nhập</button>
        <p class="forgot-pass">Quên mật khẩu ?</p>
        <div class="mxh">
          <ul>
            <li><img src="./assets/img/facebook.png" alt="" /></li>
            <li><img src="./assets/img/twitter.png" alt="" /></li>
            <li><img src="./assets/img/linkedin.png" alt="" /></li>
            <li><img src="./assets/img/instagram.png" alt="" /></li>
          </ul>
        </div>
      </div>
      <div class="sub-container">
        <div class="img">
          <div class="img-text up">
            <h2>Bạn chưa có tài khoản?</h2>
            <p>
              Đăng ký và khám phá vô vàn các địa điểm du lịch với giá ưu đãi!
            </p>
          </div>
          <div class="img-text in">
            <h2>Bạn đã có tài khoản?</h2>
            <p>
              Nếu bạn đã có tài khoản, chỉ cần đăng nhập. Chúng tôi nhớ bạn!
            </p>
          </div>
          <div class="img-btn">
            <span class="up">Đăng Ký</span>
            <span class="in">Đăng Nhập</span>
          </div>
        </div>
        <div class="form sign-up">
          <h2>Đăng Ký</h2>
          <label for="">
            <span>Tên Của Bạn</span>
            <input type="text" />
          </label>
          <label for="">
            <span>Địa Chỉ Email</span>
            <input type="email" />
          </label>
          <label for="">
            <span>Mật Khẩu</span>
            <input type="password" />
          </label>
          <label for="">
            <span>Nhập lại mật khẩu</span>
            <input type="password" />
          </label>
          <button class="submit" type="submit">Đăng ký ngay</button>
        </div>
      </div>
    </div>
    <script src="./assets/js/login.js"></script>
  </body>
</html>
